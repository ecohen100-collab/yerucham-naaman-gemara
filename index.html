<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>שיעורי גמרא, ירוחם נעמן</title>
<style>
:root{--bg:#f7f4ee;--card:#fff;--ink:#222;--mute:#777;--acc:#8a5a1f;--line:#e4ddd0;--done:#e7f2e3}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a18;--card:#262421;--ink:#eee;--mute:#999;--acc:#d9a45c;--line:#3a3631;--done:#23331f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
h1{margin:0 0 8px;font-size:1.3rem;color:var(--acc)}
input{width:100%;padding:10px 12px;font-size:1rem;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
main{max-width:900px;margin:0 auto;padding:12px 16px 200px}
.cont{background:var(--card);border:1px solid var(--acc);border-radius:10px;padding:10px 14px;margin-bottom:12px;cursor:pointer}
.seder{margin:18px 0 6px;color:var(--mute);font-size:.9rem;font-weight:600}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:6px 0}
summary{padding:10px 14px;cursor:pointer;font-weight:600;display:flex;justify-content:space-between}
summary small{color:var(--mute);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;padding:0 10px 12px}
.l{border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;font-size:.92rem;text-align:center;background:var(--card);color:var(--ink)}
.l:hover{border-color:var(--acc)}.l.done{background:var(--done)}.l.cur{border:2px solid var(--acc)}
.l.x{grid-column:1/-1;text-align:right;font-style:italic}
#player{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--acc);padding:8px 16px;display:none;z-index:9}
#player .bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;max-width:900px;margin:0 auto 6px}
#player b{font-size:1rem}
#player button,#player a{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);text-decoration:none;cursor:pointer;font-size:.9rem}
#player iframe{width:100%;max-width:900px;display:block;margin:0 auto;height:90px;border:2px solid var(--acc);border-radius:10px;background:#fff}
#pfl{max-width:900px;margin:0 auto 4px;font-size:.85rem;color:var(--acc);font-weight:600}
.none{color:var(--mute);padding:20px;text-align:center}

#player audio{width:100%;max-width:900px;display:block;margin:0 auto}
#player .ctl{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px auto 0;max-width:900px}
#player select{padding:5px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#gem{position:fixed;top:0;left:0;right:0;bottom:var(--ph,150px);background:var(--bg);z-index:8;display:none;flex-direction:column}
#gem .gh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line)}
#gem .gh button,#gem .gh a{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer;font-size:.9rem}
#gem .gh button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
#gem .gb{flex:1;overflow:auto;padding:12px 16px}
#gtxt{max-width:760px;margin:0 auto;font-family:"Frank Ruhl Libre","David","Times New Roman",serif;font-size:1.25rem;line-height:1.9}
#gtxt p{margin:0 0 .8em}
#gimg{display:block;max-width:100%;margin:0 auto;background:#fff}
#gpdf{width:100%;height:100%;min-height:70vh;border:0;background:#fff}
#gem .gb.pdf{padding:0;display:flex;flex-direction:column}
[hidden]{display:none!important}
@media (max-width:600px){#player .bar{flex-direction:column;align-items:stretch}#player .bar span{display:flex;flex-wrap:wrap;gap:4px}#player button,#player a{padding:6px 8px;font-size:.85rem}#gem .gh{padding:6px 8px}#gtxt{font-size:1.1rem}}
</style>
</head>

<header><h1>שיעורי גמרא, ירוחם נעמן</h1><input id="q" placeholder="חיפוש: מסכת ודף, בכל הש"ס: 'שבת כא', 'כא', 'סיום'"></header>

    $('gtxt').innerHTML=t.length?t.map(p=>'<p>'+clean(p)+'</p>').join(''):'אין טקסט לעמוד הזה.';}
  catch(e){if(my===req)$('gtxt').textContent='לא הצלחתי לטעון את הטקסט. אפשר לפתוח בספריא.';}}
// כפתור "חזרה" של הדפדפן/הטלפון סוגר את הגמרא במקום לצאת מהאתר
function closeGem(){if($('gem').style.display!=='flex')return;$('gem').style.display='none';if(history.state&&history.state.gem)history.back();}
window.addEventListener('popstate',()=>{$('gem').style.display='none';});
$('gm').onclick=()=>{if($('gem').style.display==='flex')closeGem();else openGem();};
$('gcl').onclick=closeGem;
$('gnx').onclick=()=>{if(amud.b){amud.d++;amud.b=false}else amud.b=true;showAmud();};
$('gpv').onclick=()=>{if(!amud.b){if(amud.d<=2)return;amud.d--;amud.b=true}else amud.b=false;showAmud();};
$('gtt').onclick=()=>{gmode='t';LS.set('yn_gmode',gmode);showAmud();};
$('gti').onclick=()=>{gmode='i';LS.set('yn_gmode',gmode);showAmud();};
$('gtp').onclick=()=>{if(MOBILE&&SL[flat[cur].m]!=='Shekalim'){window.open($('gfull').href,'_blank');return;}gmode='p';LS.set('yn_gmode',gmode);showAmud();};
$('gimg').onerror=()=>{if($('gimg').hidden)return;$('gimg').hidden=true;$('gtxt').hidden=false;$('gtxt').textContent='אין צילום לעמוד הזה.';};
window.addEventListener('resize',sizeGem);
// הפאנל תמיד נגמר מעל הנגן, גם כשהנגן משנה גובה (מעבר לנגן הדרייב, שבירת שורות)
if(window.ResizeObserver)new ResizeObserver(sizeGem).observe($('player'));
const skip=d=>{if(!au.hidden&&au.src)au.currentTime=Math.min(Math.max(0,au.currentTime+d),au.duration||1e9);};
// מקשים: רווח עצור/נגן, חצים 10 שניות, J/L 30 שניות, N/P שיעור הבא/קודם. לא בזמן הקלדה בחיפוש.
document.addEventListener('keydown',e=>{if(cur==null||e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k===' '){e.preventDefault();au.paused?au.play():au.pause();}
  else if(k==='arrowright')skip(-10);else if(k==='arrowleft')skip(10); // RTL: ימינה = אחורה
  else if(k==='j')skip(-30);else if(k==='l')skip(30);
  else if(k==='n')play(cur+1);else if(k==='p')play(cur-1);else return;});
function mediaSession(x){if(!('mediaSession' in navigator))return;
  navigator.mediaSession.metadata=new MediaMetadata({title:x.m+' '+x.t,artist:'ירוחם נעמן',album:'שיעורי גמרא'});
  const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}};
  h('seekbackward',()=>skip(-30));h('seekforward',()=>skip(30));
  h('previoustrack',()=>play(cur-1));h('nexttrack',()=>play(cur+1));}
$('q').oninput=render;render();
</script>
